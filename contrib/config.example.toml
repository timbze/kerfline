# Copy to ~/.config/kerfline/config.toml
# Token lives in ~/.config/kerfline/env (BOT_TOKEN=...), not here.
# Built-in Telegram rules apply unless AGENTS.md in this directory replaces them.

[telegram]
# webhook is the default. If public_url is empty, the bot long-polls instead.
mode = "webhook"
listen = "127.0.0.1:8787"
# HTTPS origin Telegram posts to (reverse proxy / tunnel). No trailing slash.
# public_url = "https://bot.example.com"
# Random string; also set TELEGRAM_WEBHOOK_SECRET in env if you prefer.
secret_token = "change-me"
path = "hook"
# deleteWebhook + getUpdates until empty, then setWebhook.
drain_on_start = true

[grok]
always_approve = true
disallowed_tools = ["web_fetch"]
timeout = "10m"
# gate = true
# gate_model = "grok-4.3"
# gate_timeout = "15s"
# none | low | medium | high | xhigh | omit (omit = do not send the field)
# gate_reasoning = "none"
# Voice/audio at or under this length is transcribed before the gate (require_mention = false).
# gate_speech_max = "2m"

[jailbee]
binary = "jailbee"

[media]
# Telegram photo/document staging. Defaults shown; all keys optional.
max_file_bytes = 20000000
vision = "auto"       # auto | always | never
                      # auto: JPEG/PNG pixels only on look/mixed captions, never on save-only
inbox_ttl = "168h"

[stt]
# Voice/audio transcription via Grok STT. Token is XAI_API_KEY, else grok login in the jailbee container.
# base_url = "https://api.x.ai"
# timeout = "2m"
# auth_path = "/home/dev/.grok/auth.json"
